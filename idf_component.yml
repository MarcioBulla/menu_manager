version: 1.0.0

description: "Easy and flexible menu manager for ESP-IDF project."

license: "MIT"

url: https://github.com/MarcioBulla/menu_manager
issues: https://github.com/MarcioBulla/menu_manager/issues
repository: https://github.com/MarcioBulla/menu_manager

maintainers:
  - "Marcio Bulla <marciobullajr@gmail.com>"

dependencies:
  idf:
    version: ">=4.1.0"

files:
  exclude:
    - ".gitignore"
    - "**/.pytest_cache"
    - "**/.pytest_cache/**/*"
    - "**/.venv"
    - "**/.venv/**/*"
    - "graphify-out"
    - "graphify-out/**/*"
